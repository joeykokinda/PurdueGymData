<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoRec</title>
<meta name="description" content="Live and historical crowd levels for every area of Purdue's CoRec.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --border: #e3e3df; --border-strong: #cfcfca;
    --ink: #0b0b0b; --ink-2: #4f4f4a; --ink-3: #8a8a84;
    --gold: #a87f00; --gold-fill: #cfb991;
    --typical: #5f5f5f; --band: rgba(95, 95, 95, 0.12); --track: #ececea; --predict: #c9a74a;
    --heat-low: #f3efe4; --heat-high: #6b5200; --grid: #ececea;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070707; --surface: #101010; --border: #232323; --border-strong: #333;
      --ink: #f4f4f1; --ink-2: #b3b3ad; --ink-3: #75756f;
      --gold: #daaa00; --gold-fill: #cfb991;
      --typical: #9a9a9a; --band: rgba(154, 154, 154, 0.14); --track: #222; --predict: #f0dc8c;
      --heat-low: #1a1812; --heat-high: #e8c860; --grid: #1f1f1f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); font-feature-settings: "tnum"; }

  header { border-bottom: 1px solid var(--border); background: var(--surface); }
  header::before { content: ""; display: block; height: 3px; background: var(--gold-fill); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .status b { color: var(--ink); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .open .dot { background: var(--gold); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(218, 170, 0, .5); } 100% { box-shadow: 0 0 0 8px rgba(218, 170, 0, 0); } }
  @media (prefers-reduced-motion: reduce) { .open .dot { animation: none; } }

  main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 40px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  :where(button.card) { all: unset; box-sizing: border-box; display: block; cursor: pointer; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
  button.card:hover { border-color: var(--border-strong); }
  button.card[aria-pressed=true] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  button.card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .segments { position: relative; display: flex; gap: 2px; height: 8px; }
  .segments i { flex: 1; border-radius: 2px; background: var(--track); }
  .segments i.on { background: var(--gold-fill); }
  .segments .usual { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }

  .hero { width: 100%; padding: 18px 20px; display: grid; grid-template-columns: auto auto auto 1fr; gap: 6px 36px; align-items: end; }
  .hero .num { font: 600 44px/1 var(--mono); letter-spacing: -0.03em; margin-top: 6px; white-space: nowrap; }
  .hero .label { white-space: nowrap; }
  .hero .num small { font-size: 16px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
  .hero .usual-num { color: var(--ink-3); }
  .delta { font: 600 13px var(--mono); color: var(--ink-3); align-self: end; padding-bottom: 6px; }
  .up { color: var(--gold); }
  .hero .segments { grid-column: 1 / -1; height: 18px; margin-top: 12px; }

  #sections { margin-top: 12px; }
  .more { all: unset; box-sizing: border-box; display: block; width: 100%; margin-top: 8px; padding: 10px; text-align: center; cursor: pointer;
    border: 1px dashed var(--border-strong); border-radius: 10px; font: 500 13px Inter, sans-serif; color: var(--ink-2); }
  .more:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .tile { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .tile .name { font-weight: 600; font-size: 13px; }
  .tile .members { font: 11px var(--mono); color: var(--ink-3); margin-top: -4px; }
  .tile .count { font: 600 22px/1 var(--mono); letter-spacing: -0.02em; }
  .tile .count small { font-size: 12px; color: var(--ink-3); font-weight: 400; }
  .tile .meta { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--ink-3); }
  .tile .meta .up { color: var(--gold); }
  .tile.closed .name, .tile.closed .count { color: var(--ink-3); }

  .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 18px 0; }
  .panel-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  select { font: 500 13px Inter, sans-serif; color: var(--ink); background-color: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 7px; padding: 5px 26px 5px 10px; appearance: none; cursor: pointer; max-width: 100%;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: calc(100% - 13px) 52%, calc(100% - 9px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
  select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); padding: 10px 18px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-line { width: 16px; border-top: 2px solid var(--gold); }
  .key-predict { width: 16px; border-top: 2px dashed var(--predict); }
  .key-ghost { width: 16px; height: 10px; background: var(--band); border-top: 2px dashed var(--typical); }
  svg text { font: 11px var(--mono); fill: var(--ink-3); }
  #chart { display: block; width: 100%; height: 300px; }
  .chart-wrap { padding: 6px 18px 14px; }

  .two { display: grid; grid-template-columns: 1.7fr 1fr; gap: 8px; margin-top: 8px; }
  .heat-wrap { padding: 12px 18px 16px; overflow-x: auto; }
  table.heat { border-collapse: separate; border-spacing: 2px; width: 100%; min-width: 500px; table-layout: fixed; }
  .heat th { font: 400 11px var(--mono); color: var(--ink-3); text-align: left; white-space: nowrap; }
  .heat th[scope=row] { width: 36px; }
  .heat td { height: 22px; border-radius: 3px; background: var(--track); }
  .heat td:hover { outline: 1.5px solid var(--ink); outline-offset: -1px; }
  .trend.up { color: var(--gold); }
  .extremes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 18px 4px; }
  .extremes div { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .extremes b { display: block; font: 600 20px/1.2 var(--mono); margin-top: 4px; }
  .extremes span.v { font: 12px var(--mono); color: var(--ink-3); }
  .hours { list-style: none; margin: 0; padding: 8px 18px 14px; }
  .hours li { display: grid; grid-template-columns: 52px 1fr 44px; align-items: center; gap: 10px; padding: 3px 0; font: 12px var(--mono); color: var(--ink-2); }
  .hours li i { height: 8px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .hours li i b { display: block; height: 100%; background: var(--gold-fill); border-radius: 2px; }
  .hours li span:last-child { text-align: right; }
  .hours li.min, .hours li.max { color: var(--ink); font-weight: 600; }

  #tip { position: fixed; pointer-events: none; z-index: 10; display: none; background: var(--ink); color: var(--bg);
    font: 12px/1.5 var(--mono); padding: 7px 10px; border-radius: 6px; white-space: nowrap; }
  footer { color: var(--ink-3); font: 11px var(--mono); margin-top: 20px; }
  footer a { color: var(--ink-3); }

  @media (max-width: 760px) {
    main { padding: 12px 12px 32px; }
    .two { grid-template-columns: 1fr; }
    .hero { grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 6px 16px; padding: 16px; }
    .hero .num { font-size: 28px; }
    .hero .num small { font-size: 12px; }
    .delta { grid-column: 1 / -1; padding: 0; }
    .tiles { grid-template-columns: 1fr; gap: 6px; }
    .tile { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; padding: 10px 12px; }
    .tile .name { grid-column: 1; grid-row: 1; }
    .tile .count { grid-column: 2; grid-row: 1; font-size: 17px; text-align: right; }
    .tile .members { grid-column: 1 / -1; grid-row: 2; margin: -4px 0 0; }
    .tile .segments, .tile .meta { grid-column: 1 / -1; }
    .controls { margin-left: 0; width: 100%; }
    .controls select { flex: 1; }
    #chart { height: 240px; }
    .heat-wrap { padding: 10px 12px 14px; }
    table.heat { min-width: 0; border-spacing: 1px; }
    .heat td { height: 18px; border-radius: 2px; }
    .heat th[scope=row] { width: 30px; }
    .panel-head { padding: 12px 14px 0; }
    .legend { padding: 8px 14px 0; }
    .chart-wrap { padding: 6px 8px 10px; }
    .extremes { padding: 10px 14px 4px; }
    .hours { padding: 6px 14px 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="status" id="status"><i class="dot"></i><b id="status-text">…</b><span id="status-when"></span></div>
  </div>
</header>

<main>
  <button class="card hero" id="hero" aria-pressed="true">
    <div><div class="label">Now</div><div class="num" id="now-count">–</div></div>
    <div><div class="label" id="usual-label">Usually</div><div class="num usual-num" id="usual-count">–</div></div>
    <div><div class="label" id="peak-label">Peak today</div><div class="num usual-num" id="peak-count">–</div></div>
    <div class="delta" id="now-delta"></div>
    <div class="segments" id="now-segments" aria-hidden="true"></div>
  </button>

  <div id="sections"></div>

  <section class="card" style="margin-top:22px">
    <div class="panel-head">
      <h2 id="chart-title">Whole building</h2>
      <div class="controls">
        <select id="day-select" aria-label="Day of week"></select>
        <select id="range-select" aria-label="Date range"></select>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap"><svg id="chart" role="img" aria-label="People by hour"></svg></div>
  </section>

  <div class="two">
    <section class="card">
      <div class="panel-head"><h2>Week</h2></div>
      <div class="heat-wrap"><table class="heat" id="heat"></table></div>
    </section>
    <section class="card">
      <div class="panel-head"><h2>Rest of today</h2></div>
      <div class="extremes">
        <div><span class="label">Quietest</span><b id="rest-min">–</b><span class="v" id="rest-min-v"></span></div>
        <div><span class="label">Busiest</span><b id="rest-max">–</b><span class="v" id="rest-max-v"></span></div>
      </div>
      <ul class="hours" id="rest"></ul>
    </section>
  </div>

  <footer>
    Unofficial · RecWell live feed + history from
    <a href="https://github.com/Jake-Verburgt/corec-usage">Jake-Verburgt</a>,
    <a href="https://github.com/im-kvijay/corec-tracker">im-kvijay</a>,
    <a href="https://github.com/elliottbmiller/gymScrape">elliottbmiller</a> ·
    <a href="https://github.com/joeykokinda/PurdueGymData">data &amp; code</a>
  </footer>
</main>
<div id="tip" role="tooltip"></div>

<script>
const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const dayOrder = [1, 2, 3, 4, 5, 6, 0];
const hourOrder = [...Array(24).keys()].map(hour => (hour + 5) % 24);

// Tiles in display order. Courts is the only tile that totals several areas.
const tiles = [
  { label: "Courts", areas: ["Feature Gym", "B&G Gym 1-3", "B&G Gym 4-6"], short: "Feature Gym + B&G 1–6" },
  ...["Colby Fitness", "Lower Gym", "East Fitness", "Upper Fitness", "Fitness Loft", "Fitness Pavilion", "Scifres", "Olympic Lifting Room",
    "Upper Gym", "MAC Court", "Bouldering Wall", "Kilter Board Wall", "Climbing Wall", "Climbing Cave",
    "Racquetball Courts 2-3", "Racquetball Courts 9-16", "MP2", "MP3", "MP4", "MP5", "MP6", "MP7", "Combative Arts Room",
    "Cycling Studio", "Mindfulness Room", "APGL", "Upper Track (4th Floor)", "Atrium Track (3rd Floor)",
    "East Mezzanine (3rd Floor)", "West Mezzanine (3rd Floor)", "Outdoor Tennis", "Outdoor Pickleball", "TREC",
    "Faculty/Staff Workout Area"].map(name => ({ label: name, areas: [name] })),
];
const building = { label: "Whole building", areas: [] };

const element = id => document.getElementById(id);
const getJSON = url => fetch(url).then(response => response.json());
const hourLabel = hour => `${hour % 12 || 12} ${hour < 12 ? "AM" : "PM"}`;
const shortHour = hour => `${hour % 12 || 12}${hour < 12 ? "a" : "p"}`;
const fmt = number => Math.round(number).toLocaleString();
const areaQuery = areas => areas.map(area => "area=" + encodeURIComponent(area)).join("&");
const escapeHTML = text => text.replace(/[&<>"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char]);

function campusNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Indiana/Indianapolis",
    weekday: "long", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map(part => [part.type, part.value]));
  return { weekday: days.indexOf(parts.weekday), hour: +parts.hour, minute: +parts.minute,
    iso: `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}` };
}

const narrow = matchMedia("(max-width: 760px)").matches;
// Only the main areas show until expanded, so the chart stays close.
const tileLimit = narrow ? 8 : 10;
const state = { tile: building, weekday: campusNow().weekday, range: "|", showAll: false, live: [], day: {}, buildingGrid: null, grid: null, today: null };

function segmentsHTML(fraction, count, usualFraction) {
  const filled = Math.round(Math.min(1, Math.max(0, fraction)) * count);
  let html = Array.from({ length: count }, (_, index) => `<i class="${index < filled ? "on" : ""}"></i>`).join("");
  if (usualFraction != null) html += `<b class="usual" style="left:${Math.min(100, usualFraction * 100)}%"></b>`;
  return html;
}

function liveFor(tile) {
  const names = new Set(tile.areas);
  const open = state.live.filter(area => area.fresh && (!names.size || names.has(area.name)));
  const capacity = state.live.filter(area => !names.size || names.has(area.name)).reduce((sum, area) => sum + area.capacity, 0);
  return { open: open.length > 0, count: open.reduce((sum, area) => sum + area.count, 0), capacity };
}

// Cells seen on few days are usually opening or closing time, so they are left out of peaks.
const reliable = (cells, cell) => cell && cell.days >= Math.max(2, 0.4 * Math.max(...cells.map(other => other?.days || 0)));

// ponytail: a group's usual is the sum of its members' medians, not the median of their sums.
function usualFor(tile, hour) {
  const cells = tile.areas.map(area => state.day[area]?.[hour]).filter(Boolean);
  return cells.length ? cells.reduce((sum, cell) => sum + cell.count, 0) : null;
}

function peakFor(tile) {
  let peak = null;
  for (const hour of hourOrder) {
    const counts = tile.areas.map(area => state.day[area] && reliable(state.day[area], state.day[area][hour]) ? state.day[area][hour].count : null)
      .filter(count => count != null);
    const count = counts.reduce((sum, value) => sum + value, 0);
    if (counts.length && (!peak || count > peak.count)) peak = { hour, count };
  }
  return peak;
}

function peakText(peak) {
  if (!peak) return "";
  const passed = hourOrder.indexOf(peak.hour) < hourOrder.indexOf(campusNow().hour);
  return `${passed ? "peaked" : "peak"} ${hourLabel(peak.hour)}`;
}

// Small areas compare in people, since a percentage of 2 people is noise.
function vsUsual(count, usual) {
  if (usual == null) return "";
  if (usual < 10) {
    const difference = Math.round(count - usual);
    return difference === 0 ? "about usual" : `<span class="${difference > 0 ? "up" : ""}">${Math.abs(difference)} ${difference > 0 ? "above" : "below"} usual</span>`;
  }
  const change = Math.round((count / usual - 1) * 100);
  return Math.abs(change) < 10 ? "about usual" : `<span class="${change > 0 ? "up" : ""}">${Math.abs(change)}% ${change > 0 ? "above" : "below"} usual</span>`;
}

// Today's pace (actual ÷ typical over the last three hours that have both) applied to the
// typical curve for the hours still ahead.
function predictToday(row, todayHours) {
  const seen = hourOrder.filter(hour => todayHours[hour] != null);
  const paired = seen.filter(hour => row[hour]?.count > 0).slice(-3);
  if (!paired.length) return null;
  const pace = paired.reduce((sum, hour) => sum + todayHours[hour], 0) / paired.reduce((sum, hour) => sum + row[hour].count, 0);
  const clamped = Math.min(3, Math.max(0.3, pace));
  const last = seen[seen.length - 1];
  const ahead = hourOrder.slice(hourOrder.indexOf(last) + 1).filter(hour => reliable(row, row[hour]));
  return { last, hours: Object.fromEntries(ahead.map(hour => [hour, row[hour].count * clamped])) };
}

async function init() {
  const semesters = await getJSON("/api/semesters");
  const now = campusNow();
  const today = now.iso.slice(0, 10);
  element("range-select").add(new Option("All time", "|"));
  for (const semester of semesters) {
    const current = semester.start <= today && today <= semester.end;
    element("range-select").add(new Option(semester.name + (current ? " (now)" : ""), `${semester.start}|${semester.end}`));
  }
  for (const index of dayOrder) element("day-select").add(new Option(index === now.weekday ? `${days[index]} (today)` : days[index], index));

  const params = new URLSearchParams(location.search);
  if (params.has("range")) state.range = params.get("range");
  if (params.has("day")) state.weekday = +params.get("day");
  if (params.has("tile")) state.tile = tiles.find(tile => tile.label === params.get("tile")) || building;
  element("range-select").value = state.range;
  element("day-select").value = state.weekday;

  element("range-select").onchange = event => { state.range = event.target.value; loadHistory(); };
  element("day-select").onchange = event => { state.weekday = +event.target.value; syncURL(); renderChart(); };
  element("hero").onclick = () => select(building);

  await Promise.all([loadLive(), loadHistory()]);
  setInterval(loadLive, 5 * 60 * 1000);
  addEventListener("resize", renderChart);
}

function syncURL() {
  const params = new URLSearchParams();
  if (state.tile !== building) params.set("tile", state.tile.label);
  if (state.weekday !== campusNow().weekday) params.set("day", state.weekday);
  if (state.range !== "|") params.set("range", state.range);
  history.replaceState(null, "", params.size ? "?" + params : location.pathname);
}

function select(tile) {
  state.tile = tile;
  renderLive();
  loadTile();
  element("chart-title").scrollIntoView({ behavior: "smooth", block: "center" });
}

async function loadLive() {
  const now = campusNow();
  const nowMs = Date.parse(now.iso + "Z");
  const [live, day] = await Promise.all([getJSON("/api/live"), getJSON(`/api/day?day=${now.weekday}`)]);
  // An area counts as open if it is not flagged closed and has reported within the last 3 hours.
  state.live = live.map(area => ({ ...area, fresh: !area.closed && nowMs - Date.parse(area.updated + "Z") < 3 * 3600e3 }));
  state.day = day;
  const whole = liveFor(building);
  const newest = state.live.map(area => area.updated).sort().pop();
  element("status").classList.toggle("open", whole.open);
  element("status-text").textContent = whole.open ? "OPEN" : "CLOSED";
  if (newest) {
    const hour = +newest.slice(11, 13);
    element("status-when").textContent = `${hour % 12 || 12}:${newest.slice(14, 16)} ${hour < 12 ? "AM" : "PM"}`;
  }
  renderLive();
  if (state.today) loadTile();
}

function renderLive() {
  const now = campusNow();
  const whole = liveFor(building);
  const usual = state.buildingGrid?.[now.weekday][now.hour]?.count;
  element("hero").setAttribute("aria-pressed", state.tile === building);
  element("now-count").innerHTML = whole.open ? `${fmt(whole.count)}<small> / ${fmt(whole.capacity)}</small>` : "Closed";
  element("usual-label").textContent = `Usual · ${hourLabel(now.hour)}`;
  element("usual-count").textContent = usual ? fmt(usual) : "–";
  element("now-delta").innerHTML = whole.open ? vsUsual(whole.count, usual) : "";
  const row = state.buildingGrid?.[now.weekday] || [];
  const peakHour = hourOrder.filter(hour => reliable(row, row[hour])).sort((a, b) => row[b].count - row[a].count)[0];
  element("peak-label").textContent = peakHour != null ? `Peak · ${hourLabel(peakHour)}` : "Peak today";
  element("peak-count").textContent = peakHour != null ? fmt(row[peakHour].count) : "–";
  element("now-segments").innerHTML = segmentsHTML(whole.capacity ? whole.count / whole.capacity : 0, 50,
    usual && whole.capacity ? usual / whole.capacity : null);

  const listed = new Set(tiles.flatMap(tile => tile.areas));
  const extra = state.live.filter(area => !listed.has(area.name)).map(area => ({ label: area.name, areas: [area.name] }));
  const present = [...tiles, ...extra].filter(tile => state.live.some(area => tile.areas.includes(area.name)));
  const shown = state.showAll ? present : present.slice(0, tileLimit);
  const grid = document.createElement("div");
  grid.className = "tiles";
  grid.append(...shown.map(tile => {
    const live = liveFor(tile);
    const usual = usualFor(tile, now.hour);
    const button = document.createElement("button");
    button.className = "card tile" + (live.open ? "" : " closed");
    button.setAttribute("aria-pressed", state.tile.label === tile.label);
    const fraction = live.capacity ? live.count / live.capacity : 0;
    button.innerHTML = `<div class="name">${escapeHTML(tile.label)}</div>` +
      (tile.short ? `<div class="members">${escapeHTML(tile.short)}</div>` : "") +
      `<div class="count">${live.open ? `${live.count}<small> / ${live.capacity}</small>` : "Closed"}</div>
      <div class="segments">${segmentsHTML(live.open ? fraction : 0, 24, usual != null && live.capacity ? usual / live.capacity : null)}</div>
      <div class="meta"><span>${live.open ? vsUsual(live.count, usual) : ""}</span><span>${peakText(peakFor(tile))}</span></div>`;
    button.onclick = () => select(tile);
    return button;
  }));
  const children = [grid];
  if (shown.length < present.length) {
    const more = document.createElement("button");
    more.className = "more";
    more.textContent = `Show all ${present.length}`;
    more.onclick = () => { state.showAll = true; renderLive(); };
    children.push(more);
  }
  element("sections").replaceChildren(...children);
}

async function loadHistory() {
  const [from, to] = state.range.split("|");
  state.buildingGrid = await getJSON(`/api/heatmap?from=${from}&to=${to}`);
  renderLive();
  await loadTile();
}

async function loadTile() {
  syncURL();
  const [from, to] = state.range.split("|");
  const query = areaQuery(state.tile.areas);
  [state.grid, state.today] = await Promise.all([
    getJSON(`/api/heatmap?${query}&from=${from}&to=${to}`),
    getJSON(`/api/today?${query}`),
  ]);
  element("chart-title").textContent = state.tile.short ? `${state.tile.label} · ${state.tile.short}` : state.tile.label;
  renderChart();
  renderHeatmap();
  renderTimes();
}

function pathFrom(points) {
  let d = "";
  points.forEach((point, index) => { if (point) d += `${index && points[index - 1] ? "L" : "M"}${point[0]},${point[1]}`; });
  return d;
}

function niceStep(raw) {
  const power = 10 ** Math.floor(Math.log10(raw || 1));
  return [1, 2, 2.5, 5, 10].map(multiple => multiple * power).find(candidate => candidate >= raw);
}

function renderChart() {
  if (!state.grid) return;
  const svg = element("chart");
  const width = svg.clientWidth, height = 300;
  const margin = { top: 14, right: 16, bottom: 24, left: 40 };
  const row = state.grid[state.weekday];
  const now = campusNow();
  const isToday = state.weekday === now.weekday;
  const todayHours = isToday && state.today ? state.today.hours : Array(24).fill(null);
  const hours = hourOrder.filter(hour => row[hour] || todayHours[hour] != null);
  const dayName = days[state.weekday];
  element("legend").innerHTML = (isToday ? `<span><i class="key-line"></i>Today</span><span><i class="key-predict"></i>Predicted</span>` : "") +
    `<span><i class="key-ghost"></i>Typical ${dayName}</span>`;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  if (!hours.length) { svg.innerHTML = `<text x="${width / 2}" y="${height / 2}" text-anchor="middle">No data</text>`; return; }

  const prediction = isToday ? predictToday(row, todayHours) : null;
  const predicted = prediction?.hours || {};
  const maxValue = Math.max(1, ...hours.map(hour => Math.max(row[hour]?.high || 0, todayHours[hour] || 0, predicted[hour] || 0)));
  const step = niceStep(maxValue / 4);
  const yMax = Math.ceil(maxValue / step) * step;
  const spacing = (width - margin.left - margin.right) / Math.max(1, hours.length - 1);
  const x = index => margin.left + index * spacing;
  const y = value => margin.top + (1 - value / yMax) * (height - margin.top - margin.bottom);

  let markup = "";
  for (let value = 0; value <= yMax; value += step) {
    markup += `<line x1="${margin.left}" x2="${width - margin.right}" y1="${y(value)}" y2="${y(value)}" stroke="var(--grid)" ${value ? 'stroke-dasharray="3 3"' : ""}/>`;
    markup += `<text x="${margin.left - 8}" y="${y(value) + 4}" text-anchor="end">${fmt(value)}</text>`;
  }
  const labelEvery = width < 420 ? 4 : width < 620 ? 3 : 2;
  hours.forEach((hour, index) => {
    if (index % labelEvery === 0) markup += `<text x="${x(index)}" y="${height - 4}" text-anchor="middle">${shortHour(hour)}</text>`;
  });

  // The ghost: middle 50% band and dashed median of past days, drawn behind today's line.
  const bandTop = [], bandBottom = [], typical = [], today = [];
  hours.forEach((hour, index) => {
    const cell = row[hour];
    typical.push(cell ? [x(index), y(cell.count)] : null);
    if (cell) { bandTop.push([x(index), y(cell.high)]); bandBottom.unshift([x(index), y(cell.low)]); }
    if (todayHours[hour] != null) today.push([x(index), y(todayHours[hour])]);
  });
  if (bandTop.length) markup += `<path d="M${[...bandTop, ...bandBottom].map(point => point.join(",")).join("L")}Z" fill="var(--band)"/>`;
  markup += `<path d="${pathFrom(typical)}" fill="none" stroke="var(--typical)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  if (isToday) {
    const nowIndex = hours.indexOf(now.hour);
    if (nowIndex >= 0) {
      const nowX = x(nowIndex) + (now.minute / 60) * spacing;
      markup += `<line x1="${nowX}" x2="${nowX}" y1="${margin.top}" y2="${height - margin.bottom}" stroke="var(--ink)" stroke-dasharray="2 3"/>`;
      markup += `<text x="${nowX + 5}" y="${margin.top + 6}" style="fill:var(--ink);font-weight:600">NOW</text>`;
    }
    if (prediction) {
      const start = [x(hours.indexOf(prediction.last)), y(todayHours[prediction.last])];
      const ahead = hours.filter(hour => predicted[hour] != null).map(hour => [x(hours.indexOf(hour)), y(predicted[hour])]);
      if (ahead.length) markup += `<path d="${pathFrom([start, ...ahead])}" fill="none" stroke="var(--predict)" stroke-width="2.25" stroke-dasharray="6 4" stroke-linejoin="round"/>`;
    }
    // Today can skip hours when the feed was slow, so connect across gaps and dot each real reading.
    markup += `<path d="${pathFrom(today)}" fill="none" stroke="var(--gold)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
    markup += today.map((point, index) => `<circle cx="${point[0]}" cy="${point[1]}" r="${index === today.length - 1 ? 4.5 : 2.5}" fill="var(--gold)" ${index === today.length - 1 ? 'stroke="var(--surface)" stroke-width="2"' : ""}/>`).join("");
  }
  markup += `<line id="cross" y1="${margin.top}" y2="${height - margin.bottom}" stroke="var(--ink-3)" visibility="hidden"/>`;
  markup += `<rect id="hit" x="${margin.left - spacing / 2}" y="0" width="${width - margin.left - margin.right + spacing}" height="${height}" fill="transparent"/>`;
  svg.innerHTML = markup;

  const hit = svg.querySelector("#hit"), cross = svg.querySelector("#cross"), tip = element("tip");
  hit.onmousemove = event => {
    const box = svg.getBoundingClientRect();
    const index = Math.max(0, Math.min(hours.length - 1, Math.round((event.clientX - box.left - margin.left) / spacing)));
    const hour = hours[index], cell = row[hour];
    cross.setAttribute("x1", x(index)); cross.setAttribute("x2", x(index)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${dayName.slice(0, 3)} ${hourLabel(hour)}</b>` +
      (isToday && todayHours[hour] != null ? `<br>Today ${fmt(todayHours[hour])}` : "") +
      (predicted[hour] != null ? `<br>Predicted ${fmt(predicted[hour])}` : "") +
      (cell ? `<br>Typical ${fmt(cell.count)} (${fmt(cell.low)}–${fmt(cell.high)})` : "");
    tip.style.display = "block";
    tip.style.left = Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = event.clientY + 14 + "px";
  };
  hit.onmouseleave = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); };
}

function cellsOf(grid) {
  const cells = [];
  grid.forEach((row, weekday) => row.forEach((cell, hour) => cell && cells.push({ ...cell, weekday, hour })));
  return cells;
}

function renderHeatmap() {
  const cells = cellsOf(state.grid);
  const hours = hourOrder.filter(hour => cells.some(cell => cell.hour === hour));
  const maxPct = Math.max(1, ...cells.map(cell => cell.pct));
  const table = element("heat");
  if (!cells.length) { table.innerHTML = `<tr><td style="background:none;color:var(--ink-3)">No data</td></tr>`; return; }
  let html = `<thead><tr><th></th>${hours.map(hour => `<th scope="col" aria-label="${hourLabel(hour)}">${hour % (narrow ? 6 : 3) === 0 ? shortHour(hour) : ""}</th>`).join("")}</tr></thead><tbody>`;
  for (const weekday of dayOrder) {
    html += `<tr><th scope="row">${days[weekday].slice(0, 3)}</th>`;
    for (const hour of hours) {
      const cell = state.grid[weekday][hour];
      if (!cell) { html += `<td aria-label="${days[weekday]} ${hourLabel(hour)}: no data"></td>`; continue; }
      const text = `${days[weekday].slice(0, 3)} ${hourLabel(hour)} · ~${fmt(cell.count)} · ${Math.round(cell.pct)}%`;
      html += `<td style="background:color-mix(in oklab, var(--heat-high) ${Math.round(100 * cell.pct / maxPct)}%, var(--heat-low))" data-tip="${text}" aria-label="${text}"></td>`;
    }
    html += "</tr>";
  }
  table.innerHTML = html + "</tbody>";
}

function renderTimes() {
  const now = campusNow();
  const row = state.grid[now.weekday];
  const prediction = state.today ? predictToday(row, state.today.hours) : null;
  const rest = hourOrder.slice(hourOrder.indexOf(now.hour) + 1).filter(hour => reliable(row, row[hour]))
    .map(hour => ({ hour, count: prediction?.hours[hour] ?? row[hour].count }));
  const quietest = rest.reduce((best, entry) => !best || entry.count < best.count ? entry : best, null);
  const busiest = rest.reduce((best, entry) => !best || entry.count > best.count ? entry : best, null);
  element("rest-min").textContent = quietest ? hourLabel(quietest.hour) : "–";
  element("rest-min-v").textContent = quietest ? `~${fmt(quietest.count)}` : "";
  element("rest-max").textContent = busiest ? hourLabel(busiest.hour) : "–";
  element("rest-max-v").textContent = busiest ? `~${fmt(busiest.count)}` : "";
  const top = Math.max(1, ...rest.map(entry => entry.count));
  element("rest").innerHTML = rest.map(entry =>
    `<li class="${entry === quietest ? "min" : entry === busiest ? "max" : ""}"><span>${hourLabel(entry.hour)}</span><i><b style="width:${Math.round(100 * entry.count / top)}%"></b></i><span>~${fmt(entry.count)}</span></li>`
  ).join("");
}

document.addEventListener("mousemove", event => {
  const text = event.target.dataset?.tip;
  const tip = element("tip");
  if (text) {
    tip.textContent = text;
    tip.style.display = "block";
    tip.style.left = Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = event.clientY + 14 + "px";
  } else if (event.target.id !== "hit") {
    tip.style.display = "none";
  }
});

init();
</script>
</body>
</html>
